version: 2
project_name: pct

release:
  name_template: "PCT {{.Version}}"
  prerelease: auto

before:
  hooks:
    - go mod tidy
    - go fmt ./...

builds:
  - binary: pct
    id: pct
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    asmflags:
      - all=-trimpath={{.Env.WORKINGDIR}}
    gcflags:
      - all=-trimpath={{.Env.WORKINGDIR}}
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.CommitDate}} -X main.honeycomb_api_key={{.Env.HONEYCOMB_API_KEY}} -X main.honeycomb_dataset={{.Env.HONEYCOMB_DATASET}}
    mod_timestamp: '{{ .CommitTimestamp }}'
    tags:
      - telemetry
  - binary: pct
    id: notel_pct
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    asmflags:
      - all=-trimpath={{.Env.WORKINGDIR}}
    gcflags:
      - all=-trimpath={{.Env.WORKINGDIR}}
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.CommitDate}} -X main.honeycomb_api_key={{.Env.HONEYCOMB_API_KEY}} -X main.honeycomb_dataset={{.Env.HONEYCOMB_DATASET}}
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - name_template: >-
      pct_{{ tolower .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{ if .Arm }}v{{ .Arm }}{{ end }}
      {{ if .Mips }}_{{ .Mips }}{{ end }}
    id: pct
    ids:
      - pct
    wrap_in_directory: false
    format_overrides:
      - goos: windows
        formats: ['zip']
    files:
      - templates/**/*
  - name_template: >-
      notel_pct_{{ tolower .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{ if .Arm }}v{{ .Arm }}{{ end }}
      {{ if .Mips }}_{{ .Mips }}{{ end }}
    id: notel_pct
    ids:
      - notel_pct
    wrap_in_directory: false
    format_overrides:
      - goos: windows
        formats: ['zip']
    files:
      - templates/**/*


checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ .Tag }}-{{.ShortCommit}}"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
