name: Test

on:
  pull_request:
    branches: [ main ]

env:
  go_version: 1.24

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.go_version }}

    - name: Test
      run: go test -v ./...

    - name: Build targets
      uses: goreleaser/goreleaser-action@v6
      with:
        args: build --clean --snapshot
