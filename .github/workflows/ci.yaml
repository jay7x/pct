---
name: CI

on:
  pull_request: {}
  push:
    branches:
      - main

permissions:
  contents: read

env:
  go_version: '1.25'

jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.9

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: true
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.go_version }}
          cache: false
      - name: Build single target
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          args: build --clean --snapshot --single-target -o pct.exe
      - name: Test
        run: go test -v ./...
      - name: Run acceptance tests
        run: go test -v ./acceptance/...
        env:
          # A template deployment code uses `rename()` to move a template to the
          # destination directory. That fails when temporary path is on different
          # filesystem/disk. Windows runners has TMP on another disk by default.
          # Set TMP explicitly to workaround it for now.
          TMP: ${{ github.workspace }}/tmp
          TEST_ACCEPTANCE: true

  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.go_version }}
          cache: false
      - name: Set up QEMU for cross-platform Docker buildx
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          distribution: goreleaser
          version: '~> 2'
          args: release --snapshot --clean
      - name: Run pct
        run: ./dist/pct_linux_amd64_v1/pct version

  tests:
    needs:
      - golangci-lint
      - test
      - goreleaser
    runs-on: ubuntu-latest
    name: Test suite
    steps:
      - run: echo Test suite completed
